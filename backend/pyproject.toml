[project]
name = "randoo"
version = "0.1.0"
description = "Find points of interest along a planned cycling route"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gpxpy>=1.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["randoo*"]
